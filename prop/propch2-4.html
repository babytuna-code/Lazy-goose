            </div>
        </div>

        <!-- เนื้อหา -->
        <div class="lesson-content">
            <div class="stack">
                <span class="pill brown medium">จงหาค่าของ b ในสัดส่วน&nbsp; <span class="frac"><span>2</span><span>3</span></span> = <span class="frac"><span>5</span><span>b</span></span></span>
                <div class="box bordered work">
                    <div class="work-row">
                        <div class="work-main">
                            <span>จาก</span>
                            <span class="c-blue big"><span class="cross"><span class="frac"><span>2</span><span>3</span></span><span class="x-mid"><svg viewBox="0 0 30 26" aria-hidden="true"><defs><marker id="xhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10Z" fill="currentColor"/></marker></defs><line x1="28" y1="23" x2="3" y2="3" marker-end="url(#xhead)"/><line x1="2" y1="23" x2="27" y2="3" marker-end="url(#xhead)"/></svg><span class="x-eq">=</span></span><span class="frac"><span>5</span><span><span class="var-hl">b</span></span></span></span></span>
                        </div>
                        <span class="c-red small-note">(โดยการคูณไขว้)</span>
                    </div>
                    <div class="eq">
                        <span class="lead">จะได้</span><span>2 × b</span><span>=</span><span>5 × 3</span>
                        <span class="lead">ดังนั้น</span><span>b</span><span>=</span><span><span class="frac"><span>5 × 3</span><span>2</span></span></span>
                        <span class="lead"></span><span></span><span>=</span><span>7.5</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ปุ่มย้อนกลับ / ถัดไป -->
        <nav class="lesson-nav">
            <button class="back-button" id="backBtn" type="button">← ย้อนกลับ</button>
            <button class="next-button" id="nextBtn" type="button">ถัดไป →</button>
        </nav>
    </main>
