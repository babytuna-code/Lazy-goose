<!DOCTYPE html>

<head>

    <!-- เชื่อมไฟล์ CSS -->

    <link rel="stylesheet" href="../common/settings.css">
    <link rel="stylesheet" href="./ratioch1-11.css">
</head>

<body data-prev="ratioch1-10.html" data-next="ratioch1-12.html">
    <main class="game-screen">

        <!-- ปุ่มตั้งค่า -->
        <div class="settings-wrap">
            <button class="icon-button" id="settingsButton" type="button"
                aria-label="ตั้งค่า" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94L14.37 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4L9.19 5.32c-.59.23-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.64 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.3.61.22l2.39-.96c.49.39 1.04.71 1.63.94l.36 2.52c.04.23.24.4.49.4h3.84c.25 0 .45-.17.49-.4l.36-2.52c.59-.23 1.14-.55 1.63-.94l2.39.96c.24.08.49-.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
            </button>
            <div class="settings-menu" id="settingsMenu" hidden>
                <button type="button" data-action="guide">คู่มือ</button>
                <button type="button" data-action="lessons">บทเรียน</button>
            </div>
        </div>

        <!-- เนื้อหา -->
        <div class="lesson-content">
            <div class="stack">
                <div class="problem-box">
                    อัตราส่วนของจำนวนนักเรียนหญิงต่อนักเรียนชายเป็น 20 : <span class="mark">15</span><br>
                    อัตราส่วนของจำนวนนักเรียนชายต่อจำนวนนักเรียนทั้งหมดเป็น <span class="mark">3</span> : 7<br>
                    อัตราส่วนจำนวนนักเรียนหญิงต่อนักเรียนชายต่อนักเรียนทั้งหมด เป็นเท่าใด
                </div>
                <p class="note c-blue hint-top">ต้องทำให้อัตราส่วนของจำนวนนักเรียนชายเท่ากัน</p>
                <button class="flashcard method-card" type="button" aria-pressed="false" aria-label="วิธีทำ คลิกเพื่อพลิกดูอีกวิธี">
                    <span class="flashcard-inner">
                        <span class="flashcard-face front">
                            <span class="pill method-pill">วิธีที่ 1</span>
                                <span class="note method-note"><span class="c-blue">การคูณ</span>จำนวนแรกและจำนวนหลังด้วยจำนวนเดียวกันที่ไม่ใช่ศูนย์</span>
                                <div class="box step"><span class="step-label"><span class="c-red">นักเรียนหญิง</span>ต่อ<span class="c-blue">นักเรียนชาย</span></span><span class="step-value"><span class="c-red">20</span> : <span class="circle c-blue">15</span></span></div>
                                <div class="box step"><span class="step-label"><span class="c-blue">นักเรียนชาย</span>ต่อ<span class="c-green">นักเรียนทั้งหมด</span></span><span class="step-value"><span class="c-blue">3×5</span> : <span class="c-green">7×5</span> = <span class="circle c-blue">15</span> : <span class="c-green">35</span></span></div>
                                <div class="box step"><span class="step-label"><span class="c-red">นักเรียนหญิง</span>ต่อ<span class="c-blue">นักเรียนชาย</span>ต่อ<span class="c-green">นักเรียนทั้งหมด</span></span><span class="step-value"><b><span class="c-red">20</span> : <span class="c-blue">15</span> : <span class="c-green">35</span></b></span></div>
                        </span>
                        <span class="flashcard-face back">
                            <span class="pill method-pill">วิธีที่ 2</span>
                                <span class="note method-note"><span class="c-blue">การหาร</span>จำนวนแรกและจำนวนหลังด้วยจำนวนเดียวกันที่ไม่ใช่ศูนย์</span>
                                <div class="box step"><span class="step-label"><span class="c-red">นักเรียนหญิง</span>ต่อ<span class="c-blue">นักเรียนชาย</span></span><span class="step-value"><span class="c-red">20÷5</span> : <span class="c-blue">15÷5</span> = <span class="c-red">4</span> : <span class="circle c-blue">3</span></span></div>
                                <div class="box step"><span class="step-label"><span class="c-blue">นักเรียนชาย</span>ต่อ<span class="c-green">นักเรียนทั้งหมด</span></span><span class="step-value"><span class="circle c-blue">3</span> : <span class="c-green">7</span></span></div>
                                <div class="box step"><span class="step-label"><span class="c-red">นักเรียนหญิง</span>ต่อ<span class="c-blue">นักเรียนชาย</span>ต่อ<span class="c-green">นักเรียนทั้งหมด</span></span><span class="step-value"><b><span class="c-red">4</span> : <span class="c-blue">3</span> : <span class="c-green">7</span></b></span></div>
                        </span>
                    </span>
                </button>
                <p class="flashcard-hint">( คลิกที่การ์ดเพื่อพลิกดูวิธีที่ 2 )</p>
            </div>
        </div>

        <!-- ปุ่มย้อนกลับ / ถัดไป -->
        <nav class="lesson-nav">
            <button class="back-button" id="backBtn" type="button">← ย้อนกลับ</button>
            <button class="next-button" id="nextBtn" type="button">ถัดไป →</button>
        </nav>
    </main>

    <!-- คลื่นสีเขียวด้านล่าง -->
    <div class="green-wave">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <defs>
                <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="100%" stop-color="#00BF63"/>
                </linearGradient>
            </defs>
            <path d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z"
                fill="url(#greenGradient)" stroke="#111111" stroke-width="3" />
        </svg>
    </div>

    <!-- คลื่นสีเขียวด้านบน -->
    <div class="green-wave1">
        <svg viewBox="0 20 1440 320" preserveAspectRatio="none">
            <g transform="translate(0 320) scale(1 -1)">
                <path d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z"
                    fill="url(#greenGradient)" stroke="#111111" stroke-width="3" />
            </g>
        </svg>
    </div>

    <!-- ดอกไม้ด้านล่าง -->
    <div class="daisy-container">
        <img src="../pics/daisy.png" alt="">
    </div>

    <!-- เชื่อมไฟล์ JavaScript -->
    <script src="../common/settings.js"></script>
    <script src="../common/lesson.js"></script>
</body>
</html>
